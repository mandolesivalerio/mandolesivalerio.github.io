<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fanta Pronostici 2026/2027</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f6fa}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:24px}
header{background:#172033;color:white;border-radius:18px;padding:24px 28px;margin-bottom:18px}
h1{margin:0 0 6px;font-size:28px}header p{margin:0;opacity:.82}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:white;border-radius:14px;padding:14px 16px;margin-bottom:18px;box-shadow:0 2px 10px #0000000b}
button,.filelabel,select{font:inherit;border:1px solid #d7dce5;border-radius:9px;padding:9px 12px;background:white;cursor:pointer}
button.primary{background:#172033;color:white;border-color:#172033}.status{margin-left:auto;font-size:13px;color:#667085}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button.active{background:#172033;color:white}
.card{background:white;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #0000000b}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{padding:16px;border:1px solid #e5e8ee;border-radius:12px}.stat b{display:block;font-size:25px;margin-top:5px}
.tablewrap{overflow:auto;border:1px solid #e5e8ee;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 12px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}th{background:#f8f9fb;font-size:13px}tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2f7;font-size:12px}.pts{font-weight:700}.rank{font-weight:800;width:45px}
.notice{padding:12px 14px;border-radius:10px;background:#fff8e6;border:1px solid #f0d58a;color:#654f13;margin-bottom:14px}
@media(max-width:800px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}.status{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🏆 Fanta Pronostici 2026/2027</h1>
<p>Versione pubblica in sola visualizzazione — i dati vengono letti da Google Sheets.</p>
</header>

<div class="toolbar">
<button class="primary" id="reload">↻ Aggiorna dati</button>
<select id="round"></select>
<span class="status" id="status">Caricamento…</span>
</div>

<div id="content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const GOOGLE_SHEET_ID="1an80OoLrS72q6HFw6B3je-4tOPqb05RfLNgHD0lm-mI";
const PLAYERS=["Ale","Dani","Dipa","Mando"];
let workbook=null, rounds=[];

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function n(v){return v===null||v===undefined||v===""?null:Number(v);}
function sign(a,b){a=n(a);b=n(b);if(a===null||b===null)return null;return a===b?"X":a>b?"1":"2";}

function parseWorkbook(wb){
  const params={exact:2,sign:1,bonus:3};
  const p=wb.Sheets["Parametri"];
  if(p){const rows=XLSX.utils.sheet_to_json(p,{header:1,defval:null});
    rows.forEach(r=>{if(String(r[0]).toLowerCase().includes("esatto"))params.exact=n(r[1])??2;
      if(String(r[0]).toLowerCase().includes("solo segno"))params.sign=n(r[1])??1;
      if(String(r[0]).toLowerCase().includes("bonus"))params.bonus=n(r[1])??3;});
  }
  const data=[];
  for(let i=1;i<=38;i++){
    const name="Giornata "+i, ws=wb.Sheets[name]; if(!ws)continue;
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    const matches=[];
    for(let r=1;r<rows.length;r++){
      const row=rows[r]; if(!row[0] || String(row[0]).toLowerCase().includes("totale"))continue;
      const real=[n(row[1]),n(row[2])];
      const preds={};
      PLAYERS.forEach((pl,idx)=>{const c=3+idx*2;preds[pl]=[n(row[c]),n(row[c+1])]});
      const pts={}; PLAYERS.forEach(p=>pts[p]=null);
      if(real[0]!==null && real[1]!==null){
        const rs=sign(real[0],real[1]), correct=PLAYERS.filter(p=>sign(preds[p][0],preds[p][1])===rs);
        PLAYERS.forEach(p=>{
          if(preds[p][0]===null||preds[p][1]===null)return;
          let x=sign(preds[p][0],preds[p][1])===rs?params.sign:0;
          if(preds[p][0]===real[0]&&preds[p][1]===real[1])x=params.exact;
          if(correct.length===1 && correct[0]===p)x+=params.bonus;
          pts[p]=x;
        });
      }
      matches.push({game:String(row[0]),real,preds,pts});
    }
    data.push({round:i,matches});
  }
  return {params,rounds:data};
}

function render(){
  if(!workbook)return;
  const parsed=parseWorkbook(workbook); rounds=parsed.rounds;
  const totals=Object.fromEntries(PLAYERS.map(p=>[p,0]));
  rounds.forEach(rd=>rd.matches.forEach(m=>PLAYERS.forEach(p=>totals[p]+=m.pts[p]??0)));
  const ranking=[...PLAYERS].sort((a,b)=>totals[b]-totals[a]);
  const sel=document.getElementById("round");
  const current=Number(sel.value)||1;
  sel.innerHTML=rounds.map(r=>`<option value="${r.round}">Giornata ${r.round}</option>`).join("");
  sel.value=rounds.some(r=>r.round===current)?current:(rounds[0]?.round||1);

  const rd=rounds.find(r=>r.round===Number(sel.value))||rounds[0];
  const rdTotals=Object.fromEntries(PLAYERS.map(p=>[p,rd.matches.reduce((s,m)=>s+(m.pts[p]??0),0)]));
  const played=rd.matches.filter(m=>m.real[0]!==null&&m.real[1]!==null).length;

  document.getElementById("content").innerHTML=`
  <div class="grid">
    <div class="stat"><span>Giornate</span><b>${rounds.length}</b></div>
    <div class="stat"><span>Partite in ${esc("Giornata "+rd.round)}</span><b>${rd.matches.length}</b></div>
    <div class="stat"><span>Risultati inseriti</span><b>${played}/${rd.matches.length}</b></div>
    <div class="stat"><span>Leader</span><b>${esc(ranking[0])}</b></div>
  </div>

  <div class="card"><h2>Classifica generale</h2>
    <div class="tablewrap"><table><thead><tr><th>Pos.</th><th>Giocatore</th><th>Punti</th></tr></thead><tbody>
    ${ranking.map((p,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(p)}</td><td class="pts">${totals[p]}</td></tr>`).join("")}
    </tbody></table></div>
  </div>

  <div class="card"><h2>Giornata ${rd.round}</h2>
    <div class="tablewrap"><table><thead><tr>
      <th>Partita</th><th>Risultato</th>${PLAYERS.map(p=>`<th>${p}</th>`).join("")}
    </tr></thead><tbody>
    ${rd.matches.map(m=>`<tr>
      <td><b>${esc(m.game)}</b></td>
      <td>${m.real[0]===null?"—":`${m.real[0]} - ${m.real[1]}`}</td>
      ${PLAYERS.map(p=>`<td>${m.preds[p][0]===null?"—":`${m.preds[p][0]} - ${m.preds[p][1]} <span class="badge">${m.pts[p]===null?"":m.pts[p]+" pt"}</span>`}</td>`).join("")}
    </tr>`).join("")}
    <tr><th colspan="2">Totale giornata</th>${PLAYERS.map(p=>`<th>${rdTotals[p]} pt</th>`).join("")}</tr>
    </tbody></table></div>
  </div>`;
  document.getElementById("status").textContent="Dati caricati • "+new Date().toLocaleString("it-IT");
}

async function loadDefault(){
  document.getElementById("status").textContent="Caricamento Google Sheets…";

  try{
    const sheets=[
      "Parametri",
      ...Array.from({length:38},(_,i)=>"Giornata "+(i+1))
    ];

    const wb=XLSX.utils.book_new();

    for(const sheetName of sheets){
      const url =
        "https://docs.google.com/spreadsheets/d/"
        + GOOGLE_SHEET_ID
        + "/gviz/tq?tqx=out:csv&sheet="
        + encodeURIComponent(sheetName);

      const res=await fetch(url);

      if(!res.ok){
        if(sheetName==="Parametri") continue;
        throw new Error("Impossibile leggere "+sheetName);
      }

      const csv=await res.text();

      if(!csv.trim()){
        if(sheetName==="Parametri") continue;
        throw new Error("Scheda vuota: "+sheetName);
      }

      const temp=XLSX.read(csv,{type:"string"});
      const sourceSheet=temp.Sheets[temp.SheetNames[0]];

      if(!sourceSheet){
        throw new Error("Nessun dato trovato in "+sheetName);
      }

      XLSX.utils.book_append_sheet(wb,sourceSheet,sheetName);
    }

    workbook=wb;
    render();

  }catch(e){
    console.error("Errore caricamento Google Sheets:",e);

    document.getElementById("status").textContent=
      "Errore caricamento Google Sheets";

    document.getElementById("content").innerHTML=`
      <div class="notice">
        <b>Non riesco a leggere il Google Sheet.</b><br>
        <small>${esc(e.message)}</small>
      </div>`;
  }
}


document.getElementById("reload").onclick=loadDefault;
document.getElementById("round").onchange=render;
loadDefault();
</script>
</body></html>
